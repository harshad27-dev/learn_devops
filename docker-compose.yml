services:
  mongodb:
    image: mongo:7.0
    container_name: todo_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=todo-app
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 1m30s
      timeout: 30s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: todo_api
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "4100:4100"
    environment:
      NODE_ENV: production
      PORT: 4100
      MONGODB_URI: ${MONGODB_URI}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      mongodb:
        condition: service_healthy


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: todo_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api

volumes:
  mongodb: